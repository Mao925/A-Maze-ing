[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator for the 42 A-Maze-ing project"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{name = "42 student"}]

[project.optional-dependencies]
dev = ["build", "flake8", "mypy", "pytest"]

[tool.setuptools]
packages = ["mazegen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["(^|/)(\\.venv|build|dist|__pycache__)/"]
